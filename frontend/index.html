<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="PrimeTrade Task Manager - Login or register to manage your tasks" />
  <title>PrimeTrade Task Manager — Login</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body class="auth-page">
  <div class="auth-container">
    <div class="auth-card">
      <div class="brand">
        <div class="brand-icon">⚡</div>
        <h1>PrimeTrade</h1>
        <p class="brand-tagline">Task Manager</p>
      </div>

      <div id="message" class="message hidden"></div>

      <!-- login form -->
      <div id="login-box">
        <h2>Welcome back</h2>
        <form id="login-form">
          <div class="form-group">
            <label for="login-email">Email</label>
            <input type="email" id="login-email" placeholder="you@example.com" required />
          </div>
          <div class="form-group">
            <label for="login-password">Password</label>
            <input type="password" id="login-password" placeholder="••••••••" required />
          </div>
          <button type="submit" class="btn btn-primary" id="login-submit-btn">Sign In</button>
        </form>
        <p class="switch-text">
          Don't have an account? <a href="#" id="show-register">Create one</a>
        </p>
      </div>

      <!-- register form -->
      <div id="register-box" class="hidden">
        <h2>Create account</h2>
        <form id="register-form">
          <div class="form-group">
            <label for="reg-name">Full Name</label>
            <input type="text" id="reg-name" placeholder="John Doe" required />
          </div>
          <div class="form-group">
            <label for="reg-email">Email</label>
            <input type="email" id="reg-email" placeholder="you@example.com" required />
          </div>
          <div class="form-group">
            <label for="reg-password">Password</label>
            <input type="password" id="reg-password" placeholder="Min 6 characters" required minlength="6" />
          </div>
          <button type="submit" class="btn btn-primary" id="register-submit-btn">Create Account</button>
        </form>
        <p class="switch-text">
          Already have an account? <a href="#" id="show-login">Sign in</a>
        </p>
      </div>
    </div>
  </div>

  <script src="/js/config.js"></script>
  <script src="/js/auth.js"></script>
</body>
</html>
